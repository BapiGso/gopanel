name: Build Release
permissions:
  contents: write

on:
  push:
    tags:
      - 'v*'  # 只在推送 v 开头的 tag 时触发
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.goos }}-${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: linux
            goarch: arm
          - goos: linux
            goarch: s390x
          - goos: linux
            goarch: riscv64
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: freebsd
            goarch: amd64
    env:
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: true

      - name: Build
        run: |
          version="${GITHUB_REF_NAME}"
          if [[ "$version" != v* ]]; then
            version="v0.0.0"
          fi
          output="gopanel_${GOOS}_${GOARCH}"
          [ "$GOOS" = "windows" ] && output="${output}.exe"
          [ "$GOOS" = "darwin" ] && output="gopanel_mac_${GOARCH}"
          CGO_ENABLED=0 go build -ldflags="-s -w -X=gopanel/core/security.buildVersion=${version}" -o "$output" .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: gopanel-${{ matrix.goos }}-${{ matrix.goarch }}
          path: gopanel_*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: gopanel-*
          merge-multiple: true
          path: dist

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/gopanel_*
          fail_on_unmatched_files: true
